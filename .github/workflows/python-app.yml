# CI для Lumina Launcher
# Собирает, линтит и тестит проект на Windows (GitHub-hosted), Windows 7 (self-hosted),
# Arch Linux (container) и Arch Linux (self-hosted).

name: Lumina Launcher CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  # --- Windows 10/11 (GitHub-hosted) ---
  lumina-windows:
    name: Lumina Launcher / Windows (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2019, windows-2022, windows-2025]

    steps:
    - name: Checkout Lumina Launcher
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install Lumina Launcher dependencies
      shell: pwsh
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if (Test-Path requirements.txt) { pip install -r requirements.txt }

    - name: Lint Lumina Launcher with flake8
      shell: pwsh
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Test Lumina Launcher with pytest
      shell: pwsh
      run: pytest

  # --- Windows 7 (self-hosted) ---
  # Требует self-hosted runner с лейблами: [self-hosted, windows, win7]
  lumina-windows7:
    name: Lumina Launcher / Windows 7 (self-hosted)
    runs-on: [self-hosted, windows, win7]

    steps:
    - name: Checkout Lumina Launcher
      uses: actions/checkout@v4

    - name: Check Python
      shell: cmd
      run: |
        python --version
        python -m pip --version

    - name: Install Lumina Launcher dependencies
      shell: cmd
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if exist requirements.txt pip install -r requirements.txt

    - name: Lint Lumina Launcher with flake8
      shell: cmd
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Test Lumina Launcher with pytest
      shell: cmd
      run: pytest

  # --- Arch Linux (container) ---
  lumina-arch-container:
    name: Lumina Launcher / Arch Linux (container)
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
    - name: Checkout Lumina Launcher
      uses: actions/checkout@v4

    - name: Install Python and dependencies
      run: |
        pacman -Sy --noconfirm python python-pip
        python -m pip install --upgrade pip --break-system-packages || python -m pip install --upgrade pip
        pip install flake8 pytest --break-system-packages || pip install flake8 pytest
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt --break-system-packages || pip install -r requirements.txt
        fi

    - name: Lint Lumina Launcher with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Test Lumina Launcher with pytest
      run: pytest

  # --- Arch Linux (self-hosted) ---
  # Требует self-hosted runner с лейблами: [self-hosted, linux, arch]
  lumina-arch-selfhosted:
    name: Lumina Launcher / Arch Linux (self-hosted)
    runs-on: [self-hosted, linux, arch]

    steps:
    - name: Checkout Lumina Launcher
      uses: actions/checkout@v4

    - name: Check Python
      run: |
        python --version
        python -m pip --version

    - name: Install Lumina Launcher dependencies
      run: |
        python -m pip install --upgrade pip --break-system-packages || python -m pip install --upgrade pip
        pip install flake8 pytest --break-system-packages || pip install flake8 pytest
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt --break-system-packages || pip install -r requirements.txt
        fi

    - name: Lint Lumina Launcher with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Test Lumina Launcher with pytest
      run: pytest
