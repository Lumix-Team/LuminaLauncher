name: Lumina Launcher — Auto Assign Issue

on:
  issues:
    types: [opened, reopened]

permissions:
  issues: write
  contents: read

jobs:
  auto-assign:
    name: Lumina Launcher / Auto assign
    runs-on: ubuntu-latest
    steps:
      - name: Auto assign issue
        uses: pozil/auto-assign-issue@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          assignees: creater120,LumixTeams
